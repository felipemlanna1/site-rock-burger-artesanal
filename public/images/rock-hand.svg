<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 200">
  <defs>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff6b2b"/>
      <stop offset="100%" stop-color="#cc4400"/>
    </linearGradient>
  </defs>
  <!-- Palm -->
  <rect x="40" y="80" width="70" height="80" rx="10" fill="url(#skinGrad)" opacity="0.7"/>
  <!-- Index finger up -->
  <rect x="42" y="20" width="18" height="65" rx="9" fill="url(#skinGrad)" opacity="0.7"/>
  <!-- Pinky finger up -->
  <rect x="90" y="25" width="16" height="60" rx="8" fill="url(#skinGrad)" opacity="0.7"/>
  <!-- Middle folded -->
  <rect x="60" y="55" width="16" height="30" rx="8" fill="url(#skinGrad)" opacity="0.5"/>
  <!-- Ring folded -->
  <rect x="76" y="58" width="14" height="28" rx="7" fill="url(#skinGrad)" opacity="0.5"/>
  <!-- Thumb -->
  <rect x="30" y="85" width="18" height="40" rx="9" fill="url(#skinGrad)" opacity="0.6" transform="rotate(-15 39 105)"/>
  <!-- Wrist -->
  <rect x="50" y="155" width="50" height="35" rx="5" fill="url(#skinGrad)" opacity="0.6"/>
</svg>

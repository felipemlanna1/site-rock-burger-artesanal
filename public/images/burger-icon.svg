<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160">
  <defs>
    <linearGradient id="bunTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4871a"/>
      <stop offset="100%" stop-color="#b06a10"/>
    </linearGradient>
    <linearGradient id="meat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a2810"/>
      <stop offset="100%" stop-color="#3a1808"/>
    </linearGradient>
  </defs>
  <!-- Top bun -->
  <path d="M30,60 Q30,20 100,20 Q170,20 170,60 Z" fill="url(#bunTop)"/>
  <!-- Seeds -->
  <ellipse cx="80" cy="35" rx="4" ry="2.5" fill="#f0d090" transform="rotate(-15 80 35)"/>
  <ellipse cx="110" cy="30" rx="4" ry="2.5" fill="#f0d090" transform="rotate(10 110 30)"/>
  <ellipse cx="130" cy="40" rx="4" ry="2.5" fill="#f0d090" transform="rotate(-5 130 40)"/>
  <ellipse cx="70" cy="48" rx="4" ry="2.5" fill="#f0d090" transform="rotate(20 70 48)"/>
  <!-- Lettuce -->
  <path d="M25,62 Q40,58 55,65 Q70,58 85,65 Q100,58 115,65 Q130,58 145,65 Q160,58 175,62 L175,70 Q160,66 145,73 Q130,66 115,73 Q100,66 85,73 Q70,66 55,73 Q40,66 25,70 Z" fill="#2d8a30"/>
  <!-- Tomato -->
  <rect x="28" y="72" width="144" height="10" rx="5" fill="#cc2020"/>
  <!-- Cheese -->
  <path d="M25,84 L175,84 L180,96 L20,96 Z" fill="#f5b800"/>
  <path d="M20,96 L25,84" fill="none" stroke="#f5b800" stroke-width="2"/>
  <path d="M175,84 L180,96" fill="none" stroke="#f5b800" stroke-width="2"/>
  <!-- Patty -->
  <rect x="28" y="98" width="144" height="18" rx="4" fill="url(#meat)"/>
  <!-- Grill lines -->
  <line x1="40" y1="104" x2="160" y2="104" stroke="#2a1005" stroke-width="1" opacity="0.3"/>
  <line x1="40" y1="110" x2="160" y2="110" stroke="#2a1005" stroke-width="1" opacity="0.3"/>
  <!-- Bottom bun -->
  <path d="M28,118 L172,118 Q175,118 175,122 L175,130 Q175,140 100,140 Q25,140 25,130 L25,122 Q25,118 28,118 Z" fill="#b06a10"/>
</svg>
